[candle]
# IP of the Hetzner server, filled in once it has been created in the console
SERVER_IP ansible_user=root ansible_ssh_private_key_file=~/.ssh/hetzner_candle

[candle:vars]
# Domain pointing (A record) to SERVER_IP - required for the certificate
candle_domain=CANDLE_DOMAIN
letsencrypt_email=LETSENCRYPT_EMAIL
