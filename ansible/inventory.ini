2.28.137.196 ansible_user=root ansible_ssh_private_key_file=~/.ssh/hetzner_candle

[candle:vars]
# No own domain: sslip.io resolves "2-28-137-196.sslip.io" to 2.28.137.196,
# which is enough for a Let's Encrypt certificate. The app reads this URL from
# docs/api.json (GitHub Pages), so a new IP only needs an update there.
candle_domain=2-28-137-196.sslip.io
