- name: Deploy the Candle API
  hosts: candle

  tasks:

  - name: Git checkout candle
    become: true
    become_user: candle
    ansible.builtin.git:
      repo: 'https://github.com/freegroup/candle.git'
      dest: /home/candle/candle
      force: true
      update: true

  # npm ci: exactly the versions of package-lock.json; --omit=dev leaves out
  # typescript/vitest (the npm module only knows the deprecated --production).
  - name: Install packages in /server
    become: true
    become_user: candle
    command: npm ci --omit=dev
    args:
      chdir: /home/candle/candle/server

  # The PRODUCTION secrets (git-ignored, see README). The server does not store
  # anything else: a rebuilt server only needs this file.
  - name: Copy secret file
    ansible.builtin.copy:
      src: secrets.env
      dest: /home/candle/candle/server/.env
      owner: candle
      group: candle
      mode: '0600'

  - name: Check for a Google service account key
    stat:
      path: "{{ playbook_dir }}/google-service-account.json"
    delegate_to: localhost
    become: false
    register: service_account

  - name: Copy the Google service account key (Play Integrity)
    ansible.builtin.copy:
      src: google-service-account.json
      dest: /home/candle/google-service-account.json
      owner: candle
      group: candle
      mode: '0600'
    when: service_account.stat.exists

  # startOrRestart: starts on the first deployment, restarts afterwards.
  - name: Run the application via PM2 ecosystem configuration
    become: true
    become_user: candle
    command: pm2 startOrRestart ./ecosystem.config.cjs
    args:
      chdir: /home/candle/candle/server

  # Logs contain IP addresses: keep them 14 days at most (see the privacy
  # policy in docs/index.html).
  - name: Install pm2 log rotation
    become: true
    become_user: candle
    command: pm2 install pm2-logrotate
    args:
      creates: /home/candle/.pm2/modules/pm2-logrotate

  - name: Rotate logs daily, keep 14 days
    become: true
    become_user: candle
    command: "pm2 set pm2-logrotate:{{ item }}"
    loop:
      - "rotateInterval '0 0 * * *'"
      - "retain 14"
      - "max_size 20M"
      - "compress true"
    changed_when: false

  # Without these two, pm2 forgets the process after a reboot of the server.
  - name: Save the PM2 process list
    become: true
    become_user: candle
    command: pm2 save

  - name: Start PM2 on boot
    command: pm2 startup systemd -u candle --hp /home/candle
    args:
      creates: /etc/systemd/system/pm2-candle.service

  - name: Wait until the API answers
    uri:
      url: http://127.0.0.1:8080/health
    register: api
    retries: 10
    delay: 2
    until: api.status == 200
