name: app

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']

defaults:
  run:
    working-directory: app

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - &flutter-version
        name: Read pinned Flutter version
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"
      - &setup-flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - &secrets
        name: Create env/ci.json
        run: echo '{"ORS_API_KEY": "${{ secrets.ORS_API_KEY }}"}' > env/ci.json
      - run: flutter pub get
      # TODO: drop the --no-fatal-* flags once the remaining lint findings are fixed
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - *flutter-version
      - *setup-flutter
      - *secrets
      - run: flutter build apk --debug --dart-define-from-file=env/ci.json

  ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - *flutter-version
      - *setup-flutter
      - *secrets
      - run: flutter build ios --no-codesign --dart-define-from-file=env/ci.json
